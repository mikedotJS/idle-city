name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish, and let one in-flight run finish rather than
# cancelling it — a half-deployed Pages site is worse than a slightly stale one.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The sim has no renderer, so the economy is checked here as ordinary code.
      - run: npm test

      # `npm run build` typechecks before it bundles.
      # Both values are public by design — they ship in the browser bundle —
      # so they are repository *variables*, not secrets. Leave them unset and
      # the leaderboard simply never enters the DOM; the game is unaffected.
      - run: npm run build
        env:
          VITE_BASED_URL: ${{ vars.BASED_URL }}
          VITE_BASED_ANON_KEY: ${{ vars.BASED_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
